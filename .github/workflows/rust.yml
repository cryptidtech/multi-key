name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Verify MSRV (1.99.1)
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Check
        run: cargo check --all-features

  build_linux:
    needs: msrv
    name: Build Linux
    strategy:
      fail-fast: false # force all builds to run even if one fails
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            rust: stable
            run-tests: true
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        if: matrix.run-tests
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Code Format
        if: matrix.run-tests
        run: cargo fmt --all -- --check

      - name: Code Lint
        if: matrix.run-tests
        run: cargo +${{ matrix.rust }} clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo +${{ matrix.rust }} build --verbose --all-features --target ${{ matrix.target }}

      - name: Run tests
        if: matrix.run-tests
        # The test list enables every feature except the three slow gates,
        # so the test jobs stay inside their budgets (docs/ci-test-budget.md).
        # Keep the list in sync with the [features] table. Code Lint above
        # keeps --all-features, so the gated code stays lint-checked.
        run: |
          cargo +${{ matrix.rust }} test --verbose --features deprecated,legacy_chacha20_fallback,wasm --target ${{ matrix.target }}

  build_macos:
    needs: msrv
    name: Build macOS
    strategy:
      fail-fast: false # force all builds to run even if one fails
      matrix:
        include:
          - target: aarch64-apple-darwin
            rust: stable
            run-tests: true
          - target: x86_64-apple-darwin
            rust: stable
            run-tests: true
    runs-on: [self-hosted, macos, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Check Code Format
        if: matrix.run-tests
        run: cargo fmt --all -- --check

      - name: Code Lint
        if: matrix.run-tests
        run: cargo +${{ matrix.rust }} clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo +${{ matrix.rust }} build --verbose --all-features --target ${{ matrix.target }}

      - name: Run tests
        if: matrix.run-tests
        # The test list enables every feature except the three slow gates,
        # so the test jobs stay inside their budgets (docs/ci-test-budget.md).
        # Keep the list in sync with the [features] table. Code Lint above
        # keeps --all-features, so the gated code stays lint-checked.
        run: |
          cargo +${{ matrix.rust }} test --verbose --features deprecated,legacy_chacha20_fallback,wasm --target ${{ matrix.target }}

  audit:
    needs: [build_linux, build_macos]
    name: Security Audit
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit
